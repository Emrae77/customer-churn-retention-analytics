name: Validate reference analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Download source and regenerate analytical outputs
        run: python scripts/build_project.py
      - name: Check source, denominators and cleaning behaviour
        run: python -m unittest discover -s tests -v

# This workflow does not run SQL Server or Power BI Desktop.
